<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="application-name" content="TestVault 測試站" />
<meta property="og:site_name" content="TestVault 測試站" />
<title>TestVault - 首頁</title>
<style>
  :root { color-scheme: light; --accent: #b8860b; --border: #d9d9d9; --text: #1c1c1e; --muted: #7a7a7a; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: #f4f4f5;
    color: var(--text);
  }
  .card {
    width: 360px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    text-align: center;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; }
  .brand__logo {
    width: 32px; height: 32px; border-radius: 8px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; color: white; font-weight: 700;
  }
  .brand__name { font-size: 18px; font-weight: 600; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; background: #eee;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
    font-size: 22px; color: var(--muted);
  }
  h1 { font-size: 16px; margin: 0 0 6px; }
  p.email { color: var(--muted); font-size: 13px; margin: 0 0 20px; word-break: break-all; }
  a.logout {
    display: inline-block; padding: 10px 18px; border-radius: 8px;
    background: var(--accent); color: white; text-decoration: none; font-size: 14px; font-weight: 600;
  }
  a.logout:hover { filter: brightness(1.05); }
  .hint { margin-top: 20px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand__logo">T</div>
      <div class="brand__name">TestVault</div>
    </div>
    <div class="avatar">👤</div>
    <h1>登入成功</h1>
    <p class="email" id="email-display">（沒有帳號資訊）</p>
    <a class="logout" href="index.html">登出</a>
    <p class="hint">
      這是登入後跳轉到的假頁面，純粹用來製造一次真正的網址列導覽（不是 SPA 內切換），
      方便測試擴充功能「登入後偵測到網址變化，詢問要不要把帳密關聯到這個網站」的流程。
      這個頁面一樣不會送出或儲存任何資料。
    </p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    if (email) {
      document.getElementById('email-display').textContent = email;
    }
  </script>
</body>
</html>
